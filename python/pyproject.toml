[project]
name = "lab03-rules"
version = "1.0.0"
description = "Rule based stealth NPC laboratory"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
report = ["reportlab>=4"]

[project.scripts]
lab03-scenarios = "rules.scenarios:main"
lab03-demo = "rules.demo:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
